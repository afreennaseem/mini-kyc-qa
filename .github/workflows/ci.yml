name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm_evals:
        description: Run agent evals against the real LLM (needs ANTHROPIC_API_KEY)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [e2e, api, regression, evals]
    env:
      CI: true
      AGENT_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: matrix.project == 'e2e' || matrix.project == 'regression'
        run: npx playwright install --with-deps chromium
      - run: npm run test:${{ matrix.project }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  llm-evals:
    if: github.event_name == 'workflow_dispatch' && inputs.llm_evals
    needs: test
    runs-on: ubuntu-latest
    env:
      CI: true
      AGENT_MODE: llm
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check ANTHROPIC_API_KEY
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions to run LLM evals."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run test:evals
      - name: Upload eval results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results
          path: evals/results.json
          retention-days: 14
